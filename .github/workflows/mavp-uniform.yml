name: Focused native MAVP normalized-uniform prefix

on:
  push:
    branches: [codex/mavp-uniform-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavp-uniform-${{ github.ref }}
  cancel-in-progress: false

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
  RUSTUP_TOOLCHAIN: '1.90.0'
  CARGO_BUILD_JOBS: '4'
  CARGO_TERM_COLOR: 'never'
  CARGO_PROFILE_RELEASE_DEBUG: 'false'
  CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_TARGET_DIR: ${{ github.workspace }}/mavp-uniform-target
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/mavp-uniform-target
  CFLAGS: ''
  CXXFLAGS: ''
  RUSTFLAGS: ''
  CARGO_ENCODED_RUSTFLAGS: ''
  CMAKE: ${{ github.workspace }}/envs/prior/bin/cmake
  POLARS_MAX_THREADS: '4'
  PRIOR_COMMIT: 56f6d5fb139031c20d86d7e818e7d267eb834295
  COMBINED_COMMIT: 0eb91280cf5d13095cbfdc6f8bcc477cfbcd1498
  CANDIDATE_COMMIT: 916b0de68369df410559b6dc651731cf4c36b94c
  ORIGINAL_COMMIT: b2bbc26d41ec80823c8bffb0cc436a97f29911cc

jobs:
  focused-mavp-uniform:
    name: Original C / delivered56 / combined0eb / uniform-prefix candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          path: control-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.15'
      - name: Preserve controller and require immutable product pins
        run: |
          mkdir -p mavp-uniform-results/controller
          cp control-source/scripts/mavp_uniform* control-source/scripts/migration_probe.py control-source/scripts/migration_ci_benchmark.py control-source/scripts/api.json control-source/scripts/MAVP_UNIFORM_CI.md mavp-uniform-results/controller/
          cp control-source/.github/workflows/mavp-uniform.yml mavp-uniform-results/workflow.yml
          git -C control-source rev-parse HEAD > mavp-uniform-results/controller-commit.txt
          python - <<'PY'
          import os,re
          for key in ('ORIGINAL_COMMIT','PRIOR_COMMIT','COMBINED_COMMIT','CANDIDATE_COMMIT'):
              if not re.fullmatch('[0-9a-f]{40}',os.environ[key]):
                  raise SystemExit(key+' must be frozen before this workflow can run')
          if len({os.environ[k] for k in ('ORIGINAL_COMMIT','PRIOR_COMMIT','COMBINED_COMMIT','CANDIDATE_COMMIT')}) != 4:
              raise SystemExit('four distinct immutable source pins are required')
          PY
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PRIOR_COMMIT }}
          path: sources/prior
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMBINED_COMMIT }}
          path: sources/combined
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: sources/candidate
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.ORIGINAL_COMMIT }}
          path: sources/original
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Build four portable wheels and preserve actual wheel-time Cargo fingerprints
        run: |
          mkdir -p wheels
          for side in prior combined candidate original; do
            uv venv --python 3.12.15 "envs/$side"
            uv pip install --python "envs/$side" 'maturin==1.15.0' 'cmake==4.4.4' 'polars==1.44.2' 'numpy==2.5.3' 'TA-Lib==0.8.1' pytest
            mkdir -p "wheels/$side"
            python -c 'import json,sys; print(json.dumps({"side":sys.argv[1],"command":sys.argv[2:]}))' "$side" "$PWD/envs/$side/bin/python" -m maturin build --release --locked --interpreter "$PWD/envs/$side/bin/python" --out "$PWD/wheels/$side" >> mavp-uniform-results/build-commands.jsonl
            # Force the product crate to recompile even if a shared Cargo cache saw newer source mtimes.
            # Only mtime changes; immutable source bytes and Git cleanliness are checked later.
            touch "sources/$side/src/lib.rs"
            (cd "sources/$side" && "$GITHUB_WORKSPACE/envs/$side/bin/python" -m maturin build --release --locked --interpreter "$GITHUB_WORKSPACE/envs/$side/bin/python" --out "$GITHUB_WORKSPACE/wheels/$side") > "mavp-uniform-results/$side-build.log" 2>&1
            python control-source/scripts/mavp_uniform_provenance.py \
              --compile-log "mavp-uniform-results/$side-build.log" --source "sources/$side" >> mavp-uniform-results/product-compile-proof.jsonl
            uv pip install --python "envs/$side" --no-deps "wheels/$side/"*.whl
            uv pip freeze --python "envs/$side" > "mavp-uniform-results/$side-dependencies.txt"
            mkdir -p "mavp-uniform-results/product-fingerprints/$side"
            cp -a "$CARGO_TARGET_DIR/release/.fingerprint/." "mavp-uniform-results/product-fingerprints/$side/"
          done
          rustc --version --verbose > mavp-uniform-results/toolchain.txt
          cc --version >> mavp-uniform-results/toolchain.txt
          "$CMAKE" --version >> mavp-uniform-results/toolchain.txt
          lscpu > mavp-uniform-results/lscpu.txt
          cat /proc/meminfo > mavp-uniform-results/meminfo.txt
          df -h > mavp-uniform-results/disk-after-build.txt
          du -sh "$CARGO_TARGET_DIR" wheels >> mavp-uniform-results/disk-after-build.txt
      - name: Define fixed campaign arguments
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          args=[]
          for side in ('original','prior','combined','candidate'):
              args += ['--'+side+'-python','envs/'+side+'/bin/python','--'+side+'-source','sources/'+side]
          args += ['--candidate-commit',os.environ['CANDIDATE_COMMIT'],'--wheel-dir','wheels','--output','mavp-uniform-results']
          Path('mavp-uniform-results/arguments.json').write_text(json.dumps(args))
          PY
          cat > run-mavp-uniform-campaign.py <<'PY'
          import json,subprocess,sys
          args=json.load(open('mavp-uniform-results/arguments.json'))
          subprocess.run(['envs/prior/bin/python','control-source/scripts/'+sys.argv[1],*args,*sys.argv[2:]],check=True)
          PY
      - name: Controller protocol gates and native contracts
        run: |
          envs/prior/bin/python -m pytest --noconftest control-source/tests/test_mavp_uniform_benchmark.py -q
          python run-mavp-uniform-campaign.py mavp_uniform_benchmark.py --record-build
          for side in prior combined candidate; do
            PYO3_PYTHON="$GITHUB_WORKSPACE/envs/$side/bin/python" cargo test --release --lib --locked --manifest-path "sources/$side/Cargo.toml" > "mavp-uniform-results/$side-rust-tests.log" 2>&1
          done
          envs/candidate/bin/python -m pytest --noconftest sources/candidate/tests/test_mavp_uniform_prefix.py -q > mavp-uniform-results/candidate-uniform-public-tests.log 2>&1
      - name: Full10624-case all6comparisons and8own-arm goldens before timers
        run: python run-mavp-uniform-campaign.py mavp_uniform_benchmark.py --validate-only
      - name: Twelve four-arm Williams fresh-single-case rounds at one and four threads
        run: |
          python run-mavp-uniform-campaign.py mavp_uniform_benchmark.py
          cat mavp-uniform-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
          cat mavp-uniform-results/negative-cases.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumer-mavp-uniform-prefix-evidence
          include-hidden-files: true
          path: |
            mavp-uniform-results/
            wheels/
            mavp-uniform-target/release/build/talib-sys-*/out/lib/libta-lib.a
            mavp-uniform-target/release/build/jemalloc-sys-*/out/lib/*.a
          if-no-files-found: error
