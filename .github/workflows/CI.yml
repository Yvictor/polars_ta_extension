  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin] # x86_64, 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install uv
