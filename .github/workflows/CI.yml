# Build, test and release polars_talib wheels.
#
# Every platform builds a wheel with maturin (linux inside manylinux
# containers), installs that exact wheel together with the locked dev
# dependencies (including the Python `ta-lib` package that the tests compare
# against) and runs the full pytest suite plus the micro benchmarks.
#
# TA-Lib itself is compiled from source by `talib-sys/build.rs`
# (see the `TA_LIB_VER` constant there), so no system TA-Lib is required.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: '2_28'
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: '2_28'
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64
          - name: windows-x86_64
            runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build wheel
        uses: PyO3/maturin-action@v1.46.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          uv sync --locked --no-install-project
          uv pip install --no-index --find-links dist polars-talib
          uv run --no-sync python -c "import polars_talib as plta; print('TA-Lib', plta.__talib_version__, len(plta.get_functions()), 'functions')"

      - name: Test
        shell: bash
        run: uv run --no-sync pytest -v --benchmark-disable

      - name: Benchmark
        shell: bash
        run: |
          uv run --no-sync pytest tests/test_bench.py --benchmark-only \
            --benchmark-columns=min,mean,ops --benchmark-sort=name \
            --benchmark-json=bench-${{ matrix.name }}.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.name }}
          path: bench-${{ matrix.name }}.json

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [build]
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1.46.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing *
