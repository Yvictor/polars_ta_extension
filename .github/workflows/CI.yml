name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*', '0.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only pull-request runs are superseded; a master or tag run may be publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
  CARGO_BUILD_JOBS: '4'
  POLARS_MAX_THREADS: '4'

jobs:
  wheels:
    name: Wheel / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: '2_28', python-arch: x64}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2_28', python-arch: arm64}
          - {name: musl-x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, python-arch: x64}
          - {name: musl-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, python-arch: arm64}
          - {name: macos-x64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: 'off', python-arch: x64}
          - {name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, manylinux: 'off', python-arch: arm64}
          - {name: windows-x64, runner: windows-2025, target: x86_64-pc-windows-msvc, manylinux: 'off', python-arch: x64}
          - {name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, manylinux: 'off', python-arch: arm64}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Build self-contained release wheel
        uses: PyO3/maturin-action@v1.46.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
          sccache: 'true'
          rust-toolchain: '1.90.0'
          # maturin-action installs sccache with python3; the container's
          # system Python has no pip, unlike the manylinux interpreter.
          before-script-linux: |
            if test -x /opt/python/cp312-cp312/bin/python; then
              export PATH=/opt/python/cp312-cp312/bin:$PATH
            fi
      - name: Test installed wheel (native)
        if: ${{ !startsWith(matrix.name, 'musl-') }}
        shell: bash
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test dist/*.whl 'polars==1.44.2' 'TA-Lib==0.8.1' numpy pytest pytest-benchmark
          uv run --no-project --python .wheel-test python -m pytest tests --ignore=tests/test_bench.py -q
          uv run --no-project --python .wheel-test python scripts/install_skill.py --agent codex --project .skill-test
      - name: Test installed wheel (Alpine, native CPU)
        if: startsWith(matrix.name, 'musl-')
        run: |
          docker run --rm -v "$PWD:/work" -w /work python:3.12-alpine sh -ec '
            pip install --only-binary=:all: dist/*.whl "polars==1.44.2" "TA-Lib==0.8.1" numpy pytest pytest-benchmark
            python -m pytest tests --ignore=tests/test_bench.py -q
          '
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  native-plugins:
    name: Native Claude Code and Codex plugins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tested native CLIs
        run: npm install --global @openai/codex@0.155.1 @anthropic-ai/claude-code@2.1.278
      - name: Install and discover plugin skills with native CLIs
        run: python scripts/check_native_plugins.py

  compatibility:
    name: Python ${{ matrix.python }} / Polars ${{ matrix.polars }}
    needs: wheels
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.13', '3.14']
        polars: ['1.20.0', '1.44.2', '2.0.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x64
          path: dist
      - run: python -m pip install dist/*.whl 'polars==${{ matrix.polars }}' 'TA-Lib==0.8.1' numpy pytest pytest-benchmark
      - run: python -m pytest tests --ignore=tests/test_bench.py -q

  source:
    name: Source distribution and generators
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv pip install --system maturin pytest numpy 'TA-Lib==0.8.1' 'polars==1.44.2' pytest-benchmark
      - name: Check Python dependency lock
        run: uv lock --check
      - name: Check generated wrappers are current
        run: |
          python scripts/generate_indicators.py
          python scripts/generate_skill_reference.py
          python scripts/generate_usage_manifest.py
          git diff --exit-code -- src/generated.rs python/polars_talib/__init__.py python/polars_talib/_generated.py python/polars_talib/_param_types.py scripts/public_api_coverage.json docs/indicators.md plugins/polars-talib/skills/polars-talib/reference/functions.md
      - name: Rust crate tests
        run: cargo test --lib --locked
      - name: Build source distribution and install it without system TA-Lib
        run: |
          maturin sdist --out dist
          uv pip install --system dist/*.tar.gz
          python -m pytest tests --ignore=tests/test_bench.py -q
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  migration-differential:
    name: Native migration / original release differential
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: candidate-source
      - uses: actions/checkout@v6
        with:
          ref: b2bbc26d41ec80823c8bffb0cc436a97f29911cc
          path: baseline-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x64
          path: candidate-dist
      - name: Build original release from the fixed baseline
        working-directory: baseline-source
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv maturin 'cmake>=4.2,<5' 'polars==1.44.2' 'numpy==2.5.3'
          export PATH="$PWD/.venv/bin:$PATH"
          maturin build --release --locked --out ../baseline-dist
          uv pip install --python .venv --no-deps ../baseline-dist/*.whl
      - name: Compare every public indicator including grouped and missing data
        run: |
          uv venv --python 3.12 candidate-env
          uv pip install --python candidate-env candidate-dist/*.whl 'polars==1.44.2' 'numpy==2.5.3'
          baseline-source/.venv/bin/python candidate-source/scripts/migration_probe.py --capture baseline.npz
          candidate-env/bin/python candidate-source/scripts/migration_probe.py --capture candidate.npz
          candidate-env/bin/python candidate-source/scripts/migration_probe.py --compare baseline.npz candidate.npz --report differential.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-differential
          path: |
            baseline.npz
            candidate.npz
            differential.json

  benchmark:
    name: Release benchmark / original vs delivered vs optimized adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RUSTUP_TOOLCHAIN: '1.90.0'
      CARGO_PROFILE_RELEASE_DEBUG: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate-source
      - uses: actions/checkout@v6
        with:
          ref: b2bbc26d41ec80823c8bffb0cc436a97f29911cc
          path: original-source
      - uses: actions/checkout@v6
        with:
          ref: c71cd6ecb4b48601ff409926fdb0a281505e9fec
          path: prior-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: astral-sh/setup-uv@v8.2.0
      # All three builds are portable release wheels on this one runner. No
      # published wheel, local timing or wheel built by another job is compared.
      - name: Build all three release wheels sequentially
        run: |
          mkdir -p benchmark-results
          for side in original prior candidate; do
            uv venv --python 3.12 "$side-env"
            uv pip install --python "$side-env" 'maturin==1.15.0' 'cmake==4.4.4' 'polars==1.44.2' 'numpy==2.5.3'
          done
          export PATH="$PWD/original-env/bin:$PATH"
          for side in original prior candidate; do
            (cd "$side-source" && maturin build --release --locked --out "../$side-dist") > "benchmark-results/$side-build.log" 2>&1
            uv pip install --python "$side-env" --no-deps "$side-dist/"*.whl
            uv pip freeze --python "$side-env" > "benchmark-results/$side-dependencies.txt"
          done
          sha256sum original-dist/*.whl prior-dist/*.whl candidate-dist/*.whl > benchmark-results/wheel-sha256.txt
          rustc --version --verbose > benchmark-results/toolchain.txt
          cc --version >> benchmark-results/toolchain.txt
          cmake --version >> benchmark-results/toolchain.txt
          lscpu > benchmark-results/lscpu.txt
          cat /proc/meminfo > benchmark-results/meminfo.txt
      - name: Original compatibility and exact delivered versus candidate corpus
        run: |
          mkdir -p benchmark-results/corpus
          for side in original prior candidate; do
            "$side-env/bin/python" candidate-source/scripts/migration_probe.py --capture "benchmark-results/corpus/$side.npz"
          done
          candidate-env/bin/python candidate-source/scripts/migration_probe.py --compare benchmark-results/corpus/original.npz benchmark-results/corpus/candidate.npz --report benchmark-results/corpus/original-vs-candidate.json
          candidate-env/bin/python candidate-source/scripts/migration_probe.py --compare benchmark-results/corpus/prior.npz benchmark-results/corpus/candidate.npz --exact --report benchmark-results/corpus/prior-vs-candidate-exact.json
      - name: Measure isolated Rust setup, preallocated kernel and full adapter
        working-directory: candidate-source
        env:
          PYO3_PYTHON: ${{ github.workspace }}/candidate-env/bin/python
        run: |
          cargo test --release --lib --locked adapter_cost_probe -- --ignored --nocapture > ../benchmark-results/rust-cost-probe.log 2>&1
      - name: Check workloads and alternate repeated three-build measurements
        run: |
          candidate-env/bin/python candidate-source/scripts/adapter_ci_benchmark.py \
            --original-python original-env/bin/python --original-source original-source \
            --prior-python prior-env/bin/python --prior-source prior-source \
            --candidate-python candidate-env/bin/python --candidate-source candidate-source \
            --output benchmark-results --rounds 6 --repeats 51 --thread-counts 1 4
          cat benchmark-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-adapter-benchmark
          path: |
            benchmark-results/
            original-dist/*.whl
            prior-dist/*.whl
            candidate-dist/*.whl
          if-no-files-found: error

  release:
    name: Publish tested wheels
    # Two ways to publish, both after every test job passes:
    # - push a tag equal to the pyproject.toml version;
    # - merge to master a commit whose version has no tag yet and which carries
    #   .github/release-notes/<version>.md: this run then creates the tag and
    #   GitHub release from that file with the workflow token.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')
    # native-plugins validates repository files with third-party CLIs fetched
    # from npm at run time; it is a required PR check but must not be able to
    # block wheel publication when npm or those CLI versions are unavailable.
    needs: [wheels, compatibility, source, migration-differential]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Decide what to publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release_plan.sh
      - name: Create the tag and GitHub release
        if: steps.plan.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --notes-file ".github/release-notes/$VERSION.md"
      - uses: actions/download-artifact@v7
        if: steps.plan.outputs.publish == 'true'
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v7
        if: steps.plan.outputs.publish == 'true'
        with:
          name: sdist
          path: dist
      - uses: PyO3/maturin-action@v1.46.0
        if: steps.plan.outputs.publish == 'true'
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
