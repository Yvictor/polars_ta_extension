name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*', '0.*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Release to publish (for example 0.2.0). After every test job passes,
          the run tags its own commit, creates the GitHub release from
          .github/release-notes/<tag>.md and uploads the tested wheels to PyPI.
          Leave empty for a plain test run.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event.inputs.release_tag == '' }}

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
  CARGO_BUILD_JOBS: '4'
  POLARS_MAX_THREADS: '4'

jobs:
  wheels:
    name: Wheel / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: '2_28', python-arch: x64}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2_28', python-arch: arm64}
          - {name: musl-x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, python-arch: x64}
          - {name: musl-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, python-arch: arm64}
          - {name: macos-x64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: 'off', python-arch: x64}
          - {name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, manylinux: 'off', python-arch: arm64}
          - {name: windows-x64, runner: windows-2025, target: x86_64-pc-windows-msvc, manylinux: 'off', python-arch: x64}
          - {name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, manylinux: 'off', python-arch: arm64}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - uses: astral-sh/setup-uv@v8.2.0
      - name: CMake (native hosts)
        if: runner.os != 'Linux'
        run: uv pip install --system 'cmake>=4.2,<5'
      - name: Build self-contained release wheel
        uses: PyO3/maturin-action@v1.46.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
          sccache: 'true'
          rust-toolchain: '1.90.0'
          before-script-linux: |
            if test -x /opt/python/cp312-cp312/bin/python; then
              export PATH=/opt/python/cp312-cp312/bin:$PATH
            fi
            if command -v apk >/dev/null; then
              apk add --no-cache cmake make
            else
              python3 -m pip install 'cmake>=4.2,<5'
            fi
      - name: Test installed wheel (native)
        if: ${{ !startsWith(matrix.name, 'musl-') }}
        shell: bash
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test dist/*.whl 'polars==1.44.2' 'TA-Lib==0.8.1' numpy pytest pytest-benchmark
          uv run --no-project --python .wheel-test python -m pytest tests --ignore=tests/test_bench.py -q
          uv run --no-project --python .wheel-test python scripts/install_skill.py --agent codex --project .skill-test
      - name: Test installed wheel (Alpine, native CPU)
        if: startsWith(matrix.name, 'musl-')
        run: |
          docker run --rm -v "$PWD:/work" -w /work python:3.12-alpine sh -ec '
            pip install --only-binary=:all: dist/*.whl "polars==1.44.2" "TA-Lib==0.8.1" numpy pytest pytest-benchmark
            python -m pytest tests --ignore=tests/test_bench.py -q
          '
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  native-plugins:
    name: Native Claude Code and Codex plugins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tested native CLIs
        run: npm install --global @openai/codex@0.155.1 @anthropic-ai/claude-code@2.1.278
      - name: Install and discover plugin skills with native CLIs
        run: python scripts/check_native_plugins.py

  compatibility:
    name: Python ${{ matrix.python }} / Polars ${{ matrix.polars }}
    needs: wheels
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.13', '3.14']
        polars: ['1.20.0', '1.44.2']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x64
          path: dist
      - run: python -m pip install dist/*.whl 'polars==${{ matrix.polars }}' 'TA-Lib==0.8.1' numpy pytest pytest-benchmark
      - run: python -m pytest tests --ignore=tests/test_bench.py -q

  source:
    name: Source distribution and generators
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv pip install --system maturin 'cmake>=4.2,<5' pytest numpy 'TA-Lib==0.8.1' 'polars==1.44.2' pytest-benchmark
      - name: Check Python dependency lock
        run: uv lock --check
      - name: Check generated wrappers are current
        run: |
          python scripts/generate_indicators.py
          python scripts/generate_skill_reference.py
          git diff --exit-code -- src/generated.rs talib/src/generated.rs python/polars_talib/_generated.py python/polars_talib/_param_types.py docs/indicators.md plugins/polars-talib/skills/polars-talib/reference/functions.md
      - name: Rust crate tests
        run: cargo test --manifest-path talib/Cargo.toml
      - name: Validate system-library overrides
        run: python scripts/check_build_overrides.py
      - name: Build source distribution and install it without system TA-Lib
        run: |
          maturin sdist --out dist
          uv pip install --system dist/*.tar.gz
          python -m pytest tests --ignore=tests/test_bench.py -q
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  benchmark:
    name: Release benchmark
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x64
          path: dist
      - uses: astral-sh/setup-uv@v8.2.0
      # Informational: shared runners are too noisy to gate a release on a
      # fixed regression threshold. The comparison and raw samples are kept as
      # a job summary and artifact for humans to judge.
      - name: Compare release wheels on the same runner
        run: |
          uv venv .benchmark-base
          uv venv .benchmark-candidate
          uv pip install --python .benchmark-base 'polars-talib==0.1.6' 'polars==1.44.2' 'numpy==2.5.3'
          uv pip install --python .benchmark-candidate dist/*.whl 'polars==1.44.2' 'numpy==2.5.3'
          .benchmark-base/bin/python scripts/benchmark.py --output baseline.json --repeats 51 --pin-cpus 4
          .benchmark-candidate/bin/python scripts/benchmark.py --output candidate.json --repeats 51 --pin-cpus 4
          python scripts/compare_benchmarks.py baseline.json candidate.json --output comparison.md --report-only
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark
          path: |
            baseline.json
            candidate.json
            comparison.md

  release:
    name: Publish tested wheels
    # Runs for a pushed release tag, or for a manual dispatch that names the
    # release: the dispatched run creates the tag and GitHub release itself,
    # so a tag push is not required to publish.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    # native-plugins validates repository files with third-party CLIs fetched
    # from npm at run time; it is a required PR check but must not be able to
    # block wheel publication when npm or those CLI versions are unavailable.
    needs: [wheels, compatibility, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
      - name: Create the tag and GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping creation"
            exit 0
          fi
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes
          fi
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist
      - uses: PyO3/maturin-action@v1.46.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
