name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*', '0.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
  CARGO_BUILD_JOBS: '4'
  POLARS_MAX_THREADS: '4'

jobs:
  wheels:
    name: Wheel / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: '2_28', python-arch: x64}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2_28', python-arch: arm64}
          - {name: musl-x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, python-arch: x64}
          - {name: musl-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, python-arch: arm64}
          - {name: macos-x64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: 'off', python-arch: x64}
          - {name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, manylinux: 'off', python-arch: arm64}
          - {name: windows-x64, runner: windows-2025, target: x86_64-pc-windows-msvc, manylinux: 'off', python-arch: x64}
          - {name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, manylinux: 'off', python-arch: arm64}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - uses: astral-sh/setup-uv@v8.2.0
      - name: CMake (native hosts)
        if: runner.os != 'Linux'
        run: uv pip install --system 'cmake>=4.2,<5'
      - name: Build self-contained release wheel
        uses: PyO3/maturin-action@v1.46.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
          sccache: 'true'
          rust-toolchain: '1.90.0'
          before-script-linux: |
            if test -x /opt/python/cp312-cp312/bin/python; then
              export PATH=/opt/python/cp312-cp312/bin:$PATH
            fi
            if command -v apk >/dev/null; then
              apk add --no-cache cmake make
            else
              python3 -m pip install 'cmake>=4.2,<5'
            fi
      - name: Test installed wheel (native)
        if: ${{ !startsWith(matrix.name, 'musl-') }}
        shell: bash
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test dist/*.whl 'polars==1.44.2' 'TA-Lib==0.8.1' numpy pytest pytest-benchmark
          uv run --no-project --python .wheel-test python -m pytest tests --ignore=tests/test_bench.py -q
          uv run --no-project --python .wheel-test python scripts/install_skill.py --agent codex --project .skill-test
      - name: Test installed wheel (Alpine, native CPU)
        if: startsWith(matrix.name, 'musl-')
        run: |
          docker run --rm -v "$PWD:/work" -w /work python:3.12-alpine sh -ec '
            pip install --only-binary=:all: dist/*.whl "polars==1.44.2" "TA-Lib==0.8.1" numpy pytest pytest-benchmark
            python -m pytest tests --ignore=tests/test_bench.py -q
          '
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  compatibility:
    name: Python ${{ matrix.python }} / Polars ${{ matrix.polars }}
    needs: wheels
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.13', '3.14']
        polars: ['1.20.0', '1.44.2']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x64
          path: dist
      - run: python -m pip install dist/*.whl 'polars==${{ matrix.polars }}' 'TA-Lib==0.8.1' numpy pytest pytest-benchmark
      - run: python -m pytest tests --ignore=tests/test_bench.py -q

  source:
    name: Source distribution and generators
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv pip install --system maturin 'cmake>=4.2,<5' pytest numpy 'TA-Lib==0.8.1' 'polars==1.44.2' pytest-benchmark
      - name: Check generated wrappers are current
        run: |
          python scripts/generate_indicators.py
          git diff --exit-code -- src/generated.rs talib/src/generated.rs python/polars_talib/_generated.py
      - name: Rust crate tests
        run: cargo test --manifest-path talib/Cargo.toml
      - name: Build source distribution and install it without system TA-Lib
        run: |
          maturin sdist --out dist
          uv pip install --system dist/*.tar.gz
          python -m pytest tests --ignore=tests/test_bench.py -q
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  benchmark:
    name: Release benchmark
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x64
          path: dist
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Compare release wheels on the same runner
        run: |
          uv venv .benchmark-base
          uv venv .benchmark-candidate
          uv pip install --python .benchmark-base 'polars-talib==0.1.6' 'polars==1.44.2' 'numpy==2.5.3'
          uv pip install --python .benchmark-candidate dist/*.whl 'polars==1.44.2' 'numpy==2.5.3'
          .benchmark-base/bin/python scripts/benchmark.py --output baseline.json --repeats 51 --pin-cpus 4
          .benchmark-candidate/bin/python scripts/benchmark.py --output candidate.json --repeats 51 --pin-cpus 4
          python scripts/compare_benchmarks.py baseline.json candidate.json --output comparison.md
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark
          path: |
            baseline.json
            candidate.json
            comparison.md

  release:
    name: Publish tested wheels
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, compatibility, source, benchmark]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist
      - uses: PyO3/maturin-action@v1.46.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive dist/*
