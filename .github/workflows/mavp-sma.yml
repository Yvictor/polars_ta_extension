name: Focused consumer MAVP SMA iterator backport

on:
  push:
    branches: [codex/mavp-sma-windows-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavp-sma-${{ github.ref }}
  cancel-in-progress: false

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
  RUSTUP_TOOLCHAIN: '1.90.0'
  CARGO_BUILD_JOBS: '4'
  CARGO_TERM_COLOR: 'never'
  CARGO_PROFILE_RELEASE_DEBUG: 'false'
  CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_TARGET_DIR: ${{ github.workspace }}/mavp-sma-target
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/mavp-sma-target
  CFLAGS: ''
  CXXFLAGS: ''
  RUSTFLAGS: ''
  CARGO_ENCODED_RUSTFLAGS: ''
  CMAKE: ${{ github.workspace }}/envs/prior/bin/cmake
  POLARS_MAX_THREADS: '4'
  PRIOR_COMMIT: 56f6d5fb139031c20d86d7e818e7d267eb834295
  CANDIDATE_COMMIT: 5bb6c66498794221804a76a1fd84af9501157a3f
  ORIGINAL_COMMIT: b2bbc26d41ec80823c8bffb0cc436a97f29911cc

jobs:
  focused-mavp-sma:
    name: Original C / delivered56 / MAVP SMA iterator candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          path: control-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.15'
      - name: Preserve controller and require immutable product pins
        run: |
          mkdir -p mavp-sma-results/controller
          cp control-source/scripts/mavp_sma* control-source/scripts/migration_probe.py control-source/scripts/migration_ci_benchmark.py control-source/scripts/api.json control-source/scripts/MAVP_SMA_CI.md mavp-sma-results/controller/
          cp control-source/.github/workflows/mavp-sma.yml mavp-sma-results/workflow.yml
          git -C control-source rev-parse HEAD > mavp-sma-results/controller-commit.txt
          python - <<'PY'
          import os,re
          for key in ('ORIGINAL_COMMIT','PRIOR_COMMIT','CANDIDATE_COMMIT'):
              if not re.fullmatch('[0-9a-f]{40}',os.environ[key]):
                  raise SystemExit(key+' must be frozen before this workflow can run')
          if len({os.environ[k] for k in ('ORIGINAL_COMMIT','PRIOR_COMMIT','CANDIDATE_COMMIT')}) != 3:
              raise SystemExit('three distinct immutable source pins are required')
          PY
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PRIOR_COMMIT }}
          path: sources/prior
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: sources/candidate
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.ORIGINAL_COMMIT }}
          path: sources/original
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Build three portable wheels and preserve actual wheel-time Cargo fingerprints
        run: |
          mkdir -p wheels
          for side in prior candidate original; do
            uv venv --python 3.12.15 "envs/$side"
            uv pip install --python "envs/$side" 'maturin==1.15.0' 'cmake==4.4.4' 'polars==1.44.2' 'numpy==2.5.3' pytest
            mkdir -p "wheels/$side"
            python -c 'import json,sys; print(json.dumps({"side":sys.argv[1],"command":sys.argv[2:]}))' "$side" "$PWD/envs/$side/bin/python" -m maturin build --release --locked --interpreter "$PWD/envs/$side/bin/python" --out "$PWD/wheels/$side" >> mavp-sma-results/build-commands.jsonl
            # Force the product crate to recompile even if a shared Cargo cache saw newer source mtimes.
            # Only mtime changes; immutable source bytes and Git cleanliness are checked later.
            touch "sources/$side/src/lib.rs"
            (cd "sources/$side" && "$GITHUB_WORKSPACE/envs/$side/bin/python" -m maturin build --release --locked --interpreter "$GITHUB_WORKSPACE/envs/$side/bin/python" --out "$GITHUB_WORKSPACE/wheels/$side") > "mavp-sma-results/$side-build.log" 2>&1
            python control-source/scripts/mavp_sma_provenance.py \
              --compile-log "mavp-sma-results/$side-build.log" --source "sources/$side" >> mavp-sma-results/product-compile-proof.jsonl
            uv pip install --python "envs/$side" --no-deps "wheels/$side/"*.whl
            uv pip freeze --python "envs/$side" > "mavp-sma-results/$side-dependencies.txt"
            mkdir -p "mavp-sma-results/product-fingerprints/$side"
            cp -a "$CARGO_TARGET_DIR/release/.fingerprint/." "mavp-sma-results/product-fingerprints/$side/"
          done
          rustc --version --verbose > mavp-sma-results/toolchain.txt
          cc --version >> mavp-sma-results/toolchain.txt
          "$CMAKE" --version >> mavp-sma-results/toolchain.txt
          lscpu > mavp-sma-results/lscpu.txt
          cat /proc/meminfo > mavp-sma-results/meminfo.txt
          df -h > mavp-sma-results/disk-after-build.txt
          du -sh "$CARGO_TARGET_DIR" wheels >> mavp-sma-results/disk-after-build.txt
      - name: Define fixed campaign arguments
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          args=[]
          for side in ('original','prior','candidate'):
              args += ['--'+side+'-python','envs/'+side+'/bin/python','--'+side+'-source','sources/'+side]
          args += ['--candidate-commit',os.environ['CANDIDATE_COMMIT'],'--wheel-dir','wheels','--output','mavp-sma-results']
          Path('mavp-sma-results/arguments.json').write_text(json.dumps(args))
          PY
          cat > run-mavp-sma-campaign.py <<'PY'
          import json,subprocess,sys
          args=json.load(open('mavp-sma-results/arguments.json'))
          subprocess.run(['envs/prior/bin/python','control-source/scripts/'+sys.argv[1],*args,*sys.argv[2:]],check=True)
          PY
      - name: Controller protocol gates and native contracts
        run: |
          envs/prior/bin/python -m pytest --noconftest control-source/tests/test_mavp_sma_benchmark.py -q
          python run-mavp-sma-campaign.py mavp_sma_benchmark.py --record-build
          for side in prior candidate; do
            PYO3_PYTHON="$GITHUB_WORKSPACE/envs/$side/bin/python" cargo test --release --lib --locked --manifest-path "sources/$side/Cargo.toml" > "mavp-sma-results/$side-rust-tests.log" 2>&1
          done
      - name: Full 10624-case corpus and both thread-setting exact56 goldens before timers
        run: python run-mavp-sma-campaign.py mavp_sma_benchmark.py --validate-only
      - name: Twelve balanced fresh-single-case rounds at one and four threads
        run: |
          python run-mavp-sma-campaign.py mavp_sma_benchmark.py
          cat mavp-sma-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
          cat mavp-sma-results/negative-cases.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumer-mavp-sma-iterator-evidence
          include-hidden-files: true
          path: |
            mavp-sma-results/
            wheels/
            mavp-sma-target/release/build/talib-sys-*/out/lib/libta-lib.a
            mavp-sma-target/release/build/jemalloc-sys-*/out/lib/*.a
          if-no-files-found: error
