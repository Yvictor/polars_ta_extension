name: Selected upstream WMA signed-cast evidence
on:
  push:
    branches: [codex/wma-signed-cast-ci]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wma-weights-${{ github.ref }}
  cancel-in-progress: false
env:
  CANDIDATE_COMMIT: 6208b650ccd2b980e38269d4df19f0b4b1f6d028
  BASELINE_COMMIT: ccd3172940ed1d9daa4e7197f2265810852e8910
  ORIGINAL_COMMIT: 62021c1d14ef5499505af5547384cab509adf3fc
  CARGO_BUILD_JOBS: '4'
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
  CARGO_PROFILE_RELEASE_DEBUG: 'false'
  RUSTFLAGS: ''
  CARGO_ENCODED_RUSTFLAGS: ''
  CFLAGS: ''
  CXXFLAGS: ''
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  source-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RUSTUP_TOOLCHAIN: '1.97.0'
    steps:
      - name: Require reviewed immutable candidate before checkout
        run: |
          python3 - <<'PY'
          import os,re
          p=os.environ['CANDIDATE_COMMIT']
          assert re.fullmatch('[0-9a-f]{40}',p), 'Candidate unset; checkout/build/timing blocked'
          assert len({p,os.environ['BASELINE_COMMIT'],os.environ['ORIGINAL_COMMIT']})==3
          PY
      - uses: actions/checkout@v6
        with:
          path: control-source
      - uses: actions/checkout@v6
        with:
          repository: Yvictor/ta-lib-native
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: sources/candidate
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.15'
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt
      - name: Fixed tools and protocol source
        run: |
          python -m venv evidence-env
          evidence-env/bin/python -m pip install 'numpy==2.5.3' 'cmake==4.4.4'
          echo "$PWD/evidence-env/bin" >> "$GITHUB_PATH"
          mkdir -p wma-source-gates/controller
          cp control-source/scripts/wma_weights* control-source/scripts/bench_wma_weights.rs control-source/scripts/WMA_WEIGHTS_CI.md wma-source-gates/controller/
          cp control-source/tests/test_wma_weights_benchmark.py wma-source-gates/controller/
          cp control-source/.github/workflows/wma-weights.yml wma-source-gates/workflow.yml
          git -C control-source rev-parse HEAD > wma-source-gates/controller-commit.txt
      - name: Controller negative gates without kernel timers
        run: evidence-env/bin/python -m unittest discover -s control-source/tests -p test_wma_weights_benchmark.py -v > wma-source-gates/protocol-tests.log 2>&1
      - name: Full generator library docs and strict Clippy once on1.97
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path sources/candidate/ta_codegen/generator/Cargo.toml > wma-source-gates/generator-tests.log 2>&1
          cargo clippy --locked --all-targets --manifest-path sources/candidate/ta_codegen/generator/Cargo.toml -- -D warnings > wma-source-gates/generator-clippy.log 2>&1
          cargo test --release --locked -p ta-lib --manifest-path sources/candidate/ta_codegen/output/rust/Cargo.toml > wma-source-gates/library-tests-and-docs.log 2>&1
          cargo clippy --release --locked --all-targets -p ta-lib --manifest-path sources/candidate/ta_codegen/output/rust/Cargo.toml -- -D warnings > wma-source-gates/library-clippy.log 2>&1
      - name: Full regeneration and237 current-C plus Rust indicators before timing
        run: |
          set -euo pipefail
          (cd sources/candidate && python scripts/build.py regen-check) > wma-source-gates/regen-check.log 2>&1
          (cd sources/candidate && python scripts/build.py servers --language=c,rust) > wma-source-gates/server-build.log 2>&1
          (cd sources/candidate/bin && ./ta_regtest --codegen --language=c,rust) > wma-source-gates/all-indicator-regtests.log 2>&1
          git -C sources/candidate diff --exit-code
          git -C sources/candidate status --porcelain > wma-source-gates/candidate-status.txt
          test ! -s wma-source-gates/candidate-status.txt
          python - <<'PY'
          import hashlib,json,os,tomllib
          from pathlib import Path
          out=Path('wma-source-gates');root=Path('sources/candidate')
          files=json.loads(Path('control-source/tests/data/wma-weights/source-freeze.json').read_text())['files']
          assert all(hashlib.sha256((root/p).read_bytes()).hexdigest()==h for p,h in files.items())
          assert tomllib.loads((root/'ta_codegen/output/rust/library/Cargo.toml').read_text())['package']['rust-version']=='1.88'
          logs={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.glob('*.log')}
          assert len(logs)==8
          (out/'source-gates.json').write_text(json.dumps({'logs':logs,'complete':True,'candidate':os.environ['CANDIDATE_COMMIT'],'toolchain':'1.97.0','library_msrv':'1.88','source_files':files,'regtest_reference':'current candidate C0.8.4; separate target harness uses C0.8.3'},indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wma-weights-source-gates
          path: wma-source-gates/
          include-hidden-files: true
          if-no-files-found: error
  selected-kernels:
    needs: source-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: '1.90.0'
            lto: 'false'
            cgu: '16'
          - rust: '1.97.0'
            lto: thin
            cgu: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.cgu }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: control-source
      - uses: actions/checkout@v6
        with:
          repository: Yvictor/ta-lib-native
          ref: ${{ env.BASELINE_COMMIT }}
          path: sources/baseline
      - uses: actions/checkout@v6
        with:
          repository: Yvictor/ta-lib-native
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: sources/candidate
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: Yvictor/ta-lib-native
          ref: ${{ env.ORIGINAL_COMMIT }}
          path: sources/original
      - uses: actions/download-artifact@v6
        with:
          name: wma-weights-source-gates
          path: wma-weights-results/source-gates
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.15'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Fixed per-job tooling and source/protocol bindings
        run: |
          python -m venv evidence-env
          evidence-env/bin/python -m pip install 'numpy==2.5.3' 'cmake==4.4.4'
          echo "$PWD/evidence-env/bin" >> "$GITHUB_PATH"
          echo "CMAKE=$PWD/evidence-env/bin/cmake" >> "$GITHUB_ENV"
          mkdir -p wma-weights-results/controller
          cp control-source/scripts/wma_weights* control-source/scripts/bench_wma_weights.rs control-source/scripts/WMA_WEIGHTS_CI.md wma-weights-results/controller/
          cp control-source/.github/workflows/wma-weights.yml wma-weights-results/workflow.yml
          git -C control-source rev-parse HEAD > wma-weights-results/controller-commit.txt
          rustc --version --verbose > wma-weights-results/rustc.txt
          cc --version > wma-weights-results/cc.txt
          lscpu > wma-weights-results/lscpu.txt
          python - <<'PY'
          import json,os
          from pathlib import Path
          args=[]
          for side in ('original','baseline','candidate'):args+=['--'+side+'-source','sources/'+side]
          args+=['--rust-version',os.environ['RUSTUP_TOOLCHAIN'],'--candidate-commit',os.environ['CANDIDATE_COMMIT'],'--output','wma-weights-results']
          Path('wma-weights-results/arguments.json').write_text(json.dumps(args,indent=2))
          PY
          cat > wma-weights-results/run-controller.py <<'PY'
          import json,subprocess,sys
          subprocess.run([sys.executable,'control-source/scripts/wma_weights_benchmark.py',*json.load(open('wma-weights-results/arguments.json')),*sys.argv[1:]],check=True)
          PY
      - name: Normal release libraries and actual ELF before test cache changes
        run: evidence-env/bin/python wma-weights-results/run-controller.py --build-only
      - name: Library correctness per exact toolchain before any timer
        run: |
          set -euo pipefail
          for side in baseline candidate; do
            cargo test --release --locked -p ta-lib --manifest-path "sources/$side/ta_codegen/output/rust/Cargo.toml" > "wma-weights-results/$side-library-tests.log" 2>&1
          done
      - name: All1966 public cases and75 selected goldens before900 children on this compiler only
        run: |
          evidence-env/bin/python wma-weights-results/run-controller.py
          cat wma-weights-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wma-weights-${{ matrix.rust }}
          path: wma-weights-results/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
