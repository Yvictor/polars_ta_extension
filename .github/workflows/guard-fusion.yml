name: Focused consumer Guard classification/init ablation

on:
  push:
    branches: [codex/guard-fusion-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-fusion-${{ github.ref }}
  cancel-in-progress: false

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
  RUSTUP_TOOLCHAIN: '1.90.0'
  CARGO_BUILD_JOBS: '4'
  CARGO_TERM_COLOR: 'never'
  CARGO_PROFILE_RELEASE_DEBUG: 'false'
  CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_TARGET_DIR: ${{ github.workspace }}/guard-target
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/guard-target
  CFLAGS: ''
  CXXFLAGS: ''
  RUSTFLAGS: ''
  CARGO_ENCODED_RUSTFLAGS: ''
  CMAKE: ${{ github.workspace }}/envs/prior/bin/cmake
  POLARS_MAX_THREADS: '4'
  PRIOR_COMMIT: 56f6d5fb139031c20d86d7e818e7d267eb834295
  INITIALIZATION_COMMIT: 1cf188bf417bc842a9c6227bb833542b7914d24e
  CANDIDATE_COMMIT: 98d933f2e027458e1f87d6847d199f59e13c041c
  ORIGINAL_COMMIT: b2bbc26d41ec80823c8bffb0cc436a97f29911cc

jobs:
  focused-guard-fusion:
    name: Original C / Frozen56 / init-only / fused candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          path: control-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.15'
      - name: Preserve controller and require immutable product pins
        run: |
          mkdir -p guard-results/controller
          cp control-source/scripts/guard_fusion* control-source/scripts/migration_probe.py control-source/scripts/migration_ci_benchmark.py control-source/scripts/api.json guard-results/controller/
          cp control-source/.github/workflows/guard-fusion.yml guard-results/workflow.yml
          git -C control-source rev-parse HEAD > guard-results/controller-commit.txt
          python - <<'PY'
          import os,re
          for key in ('ORIGINAL_COMMIT','PRIOR_COMMIT','INITIALIZATION_COMMIT','CANDIDATE_COMMIT'):
              if not re.fullmatch('[0-9a-f]{40}',os.environ[key]):
                  raise SystemExit(key+' must be frozen before this workflow can run')
          if len({os.environ[k] for k in ('ORIGINAL_COMMIT','PRIOR_COMMIT','INITIALIZATION_COMMIT','CANDIDATE_COMMIT')}) != 4:
              raise SystemExit('four distinct immutable source pins are required')
          PY
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PRIOR_COMMIT }}
          path: sources/prior
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: sources/candidate
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.ORIGINAL_COMMIT }}
          path: sources/original
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.INITIALIZATION_COMMIT }}
          path: sources/initialization
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Build four portable wheels and preserve actual wheel-time Cargo fingerprints
        run: |
          mkdir -p wheels
          for side in prior initialization candidate original; do
            uv venv --python 3.12.15 "envs/$side"
            uv pip install --python "envs/$side" 'maturin==1.15.0' 'cmake==4.4.4' 'polars==1.44.2' 'numpy==2.5.3' pytest
            mkdir -p "wheels/$side"
            python -c 'import json,sys; print(json.dumps({"side":sys.argv[1],"command":sys.argv[2:]}))' "$side" "$PWD/envs/$side/bin/python" -m maturin build --release --locked --interpreter "$PWD/envs/$side/bin/python" --out "$PWD/wheels/$side" >> guard-results/build-commands.jsonl
            # Force the product crate to recompile even if a shared Cargo cache saw newer source mtimes.
            # Only mtime changes; immutable source bytes and Git cleanliness are checked later.
            touch "sources/$side/src/lib.rs"
            (cd "sources/$side" && "$GITHUB_WORKSPACE/envs/$side/bin/python" -m maturin build --release --locked --interpreter "$GITHUB_WORKSPACE/envs/$side/bin/python" --out "$GITHUB_WORKSPACE/wheels/$side") > "guard-results/$side-build.log" 2>&1
            python control-source/scripts/guard_fusion_provenance.py \
              --compile-log "guard-results/$side-build.log" --source "sources/$side" >> guard-results/product-compile-proof.jsonl
            uv pip install --python "envs/$side" --no-deps "wheels/$side/"*.whl
            uv pip freeze --python "envs/$side" > "guard-results/$side-dependencies.txt"
            mkdir -p "guard-results/product-fingerprints/$side"
            cp -a "$CARGO_TARGET_DIR/release/.fingerprint/." "guard-results/product-fingerprints/$side/"
          done
          rustc --version --verbose > guard-results/toolchain.txt
          cc --version >> guard-results/toolchain.txt
          "$CMAKE" --version >> guard-results/toolchain.txt
          lscpu > guard-results/lscpu.txt
          cat /proc/meminfo > guard-results/meminfo.txt
          df -h > guard-results/disk-after-build.txt
          du -sh "$CARGO_TARGET_DIR" wheels >> guard-results/disk-after-build.txt
      - name: Define fixed campaign arguments
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          args=[]
          for side in ('original','prior','initialization','candidate'):
              args += ['--'+side+'-python','envs/'+side+'/bin/python','--'+side+'-source','sources/'+side]
          args += ['--initialization-commit',os.environ['INITIALIZATION_COMMIT'],'--candidate-commit',os.environ['CANDIDATE_COMMIT'],'--wheel-dir','wheels','--output','guard-results']
          Path('guard-results/arguments.json').write_text(json.dumps(args))
          PY
          cat > run-guard-campaign.py <<'PY'
          import json,subprocess,sys
          args=json.load(open('guard-results/arguments.json'))
          subprocess.run(['envs/prior/bin/python','control-source/scripts/'+sys.argv[1],*args,*sys.argv[2:]],check=True)
          PY
      - name: Controller protocol gates and native contracts
        run: |
          envs/prior/bin/python -m pytest --noconftest control-source/tests/test_guard_fusion_*.py -q
          python run-guard-campaign.py guard_fusion_benchmark.py --record-build
          for side in prior initialization candidate; do
            PYO3_PYTHON="$GITHUB_WORKSPACE/envs/$side/bin/python" cargo test --release --lib --locked --manifest-path "sources/$side/Cargo.toml" > "guard-results/$side-rust-tests.log" 2>&1
          done
      - name: Full 10624-case corpus and both thread-setting exact56 goldens before timers
        run: python run-guard-campaign.py guard_fusion_benchmark.py --validate-only
      - name: Actual installed Linux product CFG gate (fail closed before timers)
        run: envs/prior/bin/python control-source/scripts/guard_fusion_codegen.py --output guard-results
      - name: Twelve balanced Williams fresh-single-case rounds at one and four threads
        run: |
          python run-guard-campaign.py guard_fusion_benchmark.py
          cat guard-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
          cat guard-results/negative-cases.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guard-classification-initialization-evidence
          include-hidden-files: true
          path: |
            guard-results/
            wheels/
            guard-target/release/build/talib-sys-*/out/lib/libta-lib.a
            guard-target/release/build/jemalloc-sys-*/out/lib/*.a
          if-no-files-found: error
