[package]
name = "polars_talib"
version = "0.2.1"
edition = "2021"
description = "Native Polars expressions for all TA-Lib technical indicators"
license = "MIT"
repository = "https://github.com/Yvictor/polars_ta_extension"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_polars_talib"
crate-type = ["cdylib"]


[dependencies]
pyo3 = { version = "0.20", features = ["abi3-py310"] }
pyo3-polars = { version = "0.10.0", features = ["derive"] }
polars = {version = "0.36.2", features = ["dtype-struct", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"]}
# "performant", "lazy", "dtype-array"
serde = { version = "*", features = ["derive"] }
ta-lib = "=0.8.3"
multiversion = "=0.7.4"

[target.'cfg(any(not(target_os = "linux"), use_mimalloc))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
 
[target.'cfg(target_os = "linux")'.dependencies]
jemallocator = { version = "0.5", features = ["disable_initial_exec_tls"] }

[dev-dependencies]
serde-pickle = "=1.2.0"
