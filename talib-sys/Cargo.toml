[package]
name = "talib-sys"
version = "0.2.0"
edition = "2021"
description = "Ta-Lib binding generated by bindgen"
keywords = ["Ta-Lib"]
readme = "README.md"
build = "build.rs"
links = "ta-lib"
license = "MIT"
categories = ["api-bindings"]
repository = "https://github.com/Yvictor/polars_ta_extension"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
# Only needed when regenerating `src/bindings.rs` (see the `bindgen` feature).
bindgen = { version = "0.69.1", optional = true }
reqwest = { version = "0.11", default-features = false, features = [
    "blocking",
    "rustls-tls-webpki-roots",
    "rustls-tls-native-roots",
] }
tar = "0.4.38"
flate2 = "1.0.26"

[features]
default = []
# Regenerate `src/bindings.rs` from the TA-Lib headers at build time.
# Requires libclang. The committed bindings are portable, so this is only
# needed when bumping the bundled TA-Lib version.
bindgen = ["dep:bindgen"]
