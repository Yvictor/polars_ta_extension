[package]
name = "talib-sys"
version = "0.2.0"
edition = "2021"
description = "Ta-Lib binding generated by bindgen"
keywords = ["Ta-Lib"]
readme = "README.md"
build = "build.rs"
license = "MIT"
categories = ["api-bindings"]
repository = "https://github.com/Yvictor/polars_ta_extension"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[features]
regenerate-bindings = ["dep:bindgen"]

[build-dependencies]
bindgen = { version = "0.69.5", optional = true }
cmake = "0.1"
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"
